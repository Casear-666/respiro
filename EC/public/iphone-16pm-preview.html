<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>精力日历 · iPhone 16 Pro Max 预览</title>
  <style>
    :root {
      color-scheme: dark;
      --frame-w: 464px;
      --frame-h: 980px;
      --screen-w: 440px;
      --screen-h: 956px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 0%, rgb(53 68 96 / 0.44), transparent 34%),
        linear-gradient(145deg, #090b10, #151923 58%, #0d1017);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 10px;
    }

    .preview-fit {
      position: relative;
      flex: none;
    }

    .phone {
      width: var(--frame-w);
      height: var(--frame-h);
      padding: 12px;
      border-radius: 58px;
      background: linear-gradient(145deg, #30343c, #08090c 48%, #242832);
      box-shadow:
        0 30px 80px rgb(0 0 0 / 0.55),
        inset 0 0 0 1px rgb(255 255 255 / 0.14),
        inset 0 0 0 3px rgb(0 0 0 / 0.7);
      transform-origin: top left;
    }

    .screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      overflow: hidden;
      border-radius: 47px;
      background: #f6f5f1;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.5);
    }

    .screen::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 50%;
      width: 122px;
      height: 34px;
      border-radius: 20px;
      transform: translateX(-50%);
      background: #050507;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.04);
      pointer-events: none;
    }

    .screen::after {
      content: "";
      position: absolute;
      z-index: 2;
      bottom: 8px;
      left: 50%;
      width: 134px;
      height: 5px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgb(0 0 0 / 0.72);
      pointer-events: none;
    }

    iframe {
      display: block;
      width: var(--screen-w);
      height: var(--screen-h);
      border: 0;
      background: #f6f5f1;
    }

    .device-caption {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 7px 10px;
      border: 1px solid rgb(255 255 255 / 0.1);
      border-radius: 999px;
      background: rgb(9 11 16 / 0.72);
      color: rgb(235 238 245 / 0.82);
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      backdrop-filter: blur(14px);
    }

    .device-caption strong {
      color: #fff;
      font-weight: 650;
    }

    .device-caption span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 360px), (max-height: 560px) {
      .device-caption { display: none; }
    }
  </style>
</head>
<body>
  <div class="preview-fit" id="previewFit">
    <div class="phone" id="phone">
      <div class="screen">
        <iframe src="/?mobilePreview=1" title="精力日历 iPhone 16 Pro Max 手机端预览"></iframe>
      </div>
    </div>
  </div>
  <div class="device-caption" aria-hidden="true">
    <strong>iPhone 16 Pro Max</strong>
    <span>440 × 956 CSS px · DPR 3 · 预览页可交互</span>
  </div>
  <script>
    const FRAME_WIDTH = 464;
    const FRAME_HEIGHT = 980;
    const fit = document.getElementById('previewFit');
    const phone = document.getElementById('phone');

    function resizePreview() {
      const availableWidth = Math.max(220, window.innerWidth - 20);
      const availableHeight = Math.max(320, window.innerHeight - 20);
      const scale = Math.min(1, availableWidth / FRAME_WIDTH, availableHeight / FRAME_HEIGHT);
      fit.style.width = `${FRAME_WIDTH * scale}px`;
      fit.style.height = `${FRAME_HEIGHT * scale}px`;
      phone.style.transform = `scale(${scale})`;
    }

    const frame = document.querySelector('iframe');

    function applyIphoneSafeArea() {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.documentElement.style.setProperty('--safe-area-inset-top', '62px');
      doc.documentElement.style.setProperty('--safe-area-inset-right', '0px');
      doc.documentElement.style.setProperty('--safe-area-inset-bottom', '34px');
      doc.documentElement.style.setProperty('--safe-area-inset-left', '0px');
    }

    frame.addEventListener('load', applyIphoneSafeArea);
    resizePreview();
    window.addEventListener('resize', resizePreview);
  </script>
</body>
</html>
